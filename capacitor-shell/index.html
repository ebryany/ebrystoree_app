<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ebrystore</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f5;
        color: #1c2526;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #5b6566;
        margin: 0 0 20px;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #0b3d3f;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tidak bisa terhubung</h1>
      <p>Periksa koneksi internet, lalu coba lagi.</p>
      <button type="button" onclick="location.href = 'https://app.ebrystore.my.id'">Coba lagi</button>
    </main>
  </body>
</html>
